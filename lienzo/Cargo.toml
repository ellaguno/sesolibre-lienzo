[workspace]
resolver = "2"
members = ["core", "cli", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
opt-level = 3
debug = false
strip = "debuginfo"

[profile.dev]
opt-level = 1

# Las dependencias se optimizan siempre: Bevy en debug es inusable.
[profile.dev.package."*"]
opt-level = 3
