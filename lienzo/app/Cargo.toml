[package]
name = "lienzo-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lienzo-app"
path = "src/main.rs"

[dependencies]
lienzo-core = { path = "../core" }
bevy = { version = "0.20", default-features = false, features = [
    "bevy_window", "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_pbr",
    "bevy_asset", "bevy_log", "bevy_post_process", "bevy_ui", "bevy_ui_render", "bevy_text", "default_font", "bevy_picking", "ui_picking", "png", "x11", "wayland",
    "multi_threaded", "std", "async_executor",
] }
cpal = "0.18"
anyhow = "1"

# En Android la app es una biblioteca que carga la actividad nativa.
[lib]
name = "lienzo_app"
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"

[target.'cfg(target_os = "android")'.dependencies]
# El backend Vulkan de wgpu aborta en los drivers Mali; en Android se usa GLES.
# `webgl2` hace que los shaders no usen storage buffers en el vértice, que GLES
# no ofrece (sin eso el layout de la vista falla con VERTEX_STORAGE).
bevy = { version = "0.20", default-features = false, features = ["android-native-activity", "webgl2"] }
bevy_render = { version = "0.20", features = ["gles"] }

[package.metadata.android]
package = "org.sesolibre.lienzo"
build_targets = ["aarch64-linux-android"]
apk_name = "lienzo"
assets = "../android/assets"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.application]
label = "Lienzo"
