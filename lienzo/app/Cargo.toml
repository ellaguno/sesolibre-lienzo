[package]
name = "lienzo-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lienzo-app"
path = "src/main.rs"

[dependencies]
lienzo-core = { path = "../core" }
bevy = { version = "0.20", default-features = false, features = [
    "bevy_window", "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_pbr",
    "bevy_asset", "bevy_log", "bevy_post_process", "bevy_ui", "bevy_ui_render", "bevy_text", "default_font", "bevy_picking", "ui_picking", "png", "x11", "wayland",
    "multi_threaded", "std", "async_executor",
] }
cpal = "0.18"
anyhow = "1"
